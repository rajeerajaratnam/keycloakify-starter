executeActionsBody=Dear {4},\n\nWelcome to {2}! We are excited to have you onboard. Your User Account has been created. Please find your account details below:\n\nEmail Address: {5}\nTemporary Password: {6}\nSystem Link: {0}\n\nRequired Actions:\n\nFirst-time login\nClick on the system access link provided above and log in using your email address and temporary password.\n\nMandatory password reset\nUpon your first login, you will be prompted to create a new password.\n\n2FA setup (if enabled)\nIf enabled for your account, you will also be prompted to complete Two-Factor Authentication setup to further secure your profile.\n\nSecurity Notice: This temporary password expires in {1}.\n\nFor assistance, contact your IT support team.

executeActionsBodyHtml=<p>Dear {4},</p><p>Welcome to {2}! We are excited to have you onboard. Your User Account has been created. Please find your account details below:</p><ul><li><strong>Email Address:</strong> {5}</li><li><strong>Temporary Password:</strong> {6}</li><li><strong>System Link:</strong> <a href="{0}">{0}</a></li></ul><p><strong>Required Actions:</strong></p><ol><li>First-time login: Click on the system access link above and log in using your email address and temporary password.</li><li>Mandatory password reset: Upon first login, you’ll be prompted to create a new password.</li><li>2FA setup (if enabled): You may be asked to configure two-factor authentication.</li></ol><p><strong>Security Notice:</strong> This temporary password expires in {1}.</p><p>For assistance, contact your IT support team.</p>


