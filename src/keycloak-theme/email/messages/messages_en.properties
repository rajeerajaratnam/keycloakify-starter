passwordResetSubject=Reset password
passwordResetBody=Rise HR – Reset Password Link\n\n Hi {2},\n\nIt seems like you''ve forgotten your password for Rise HR. We''re here to help you regain access to your account!\n\nTo reset your password, click the button below. This will redirect you to the password change page, where you can set up a new password and securely access your Rise HR account.\n\nIf the button above doesn''t work, you can also copy and paste the following link into your browser:.\n\n {0}\n\nKindly note that this link will expire in {3} hours for security reasons. Make sure to complete the password reset process promptly.\n\nOur support team is ready to assist you if you have any questions or encounter any issues. Reach out to us at {4}.\n\nWe appreciate your commitment to Rise HR, and we''re here to ensure a seamless experience for you.\n\nBest Regards,\n\nThe Rise HR Team
passwordResetBodyHtml=<h1>Rise HR – Reset Password Link</h1><p>Hi {2},</p><p>It seems like you''ve forgotten your password for Rise HR. We''re here to help you regain access to your account!</p><p>To reset your password, click the button below. This will redirect you to the password change page, where you can set up a new password and securely access your Rise HR account.</p> <div style="text-align: center;"><a style="display: inline-block;padding: 10px 20px;background-color: #007bff;color: #ffffff;text-decoration: none;border-radius: 5px;" href="{0}">Reset Password</a></div><p>If the button above doesn''t work, you can also copy and paste the following link into your browser:</p><a href="{0}">Link to confirm account linking</a><p>Kindly note that this link will expire in {3} hours for security reasons. Make sure to complete the password reset process promptly.</p><p>Our support team is ready to assist you if you have any questions or encounter any issues. Reach out to us at {4}</p><p>We appreciate your commitment to Rise HR, and we''re here to ensure a seamless experience for you.</p><p>Best Regards,</p><p>The Rise HR Team</p>
